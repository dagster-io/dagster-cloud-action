name: "Initialize CI"
description: "Parse configuration and initialize CI state"
inputs:
  project_dir:
    required: true
    description: "The root directory of the dagster project."
  dagster_cloud_yaml_path:
    required: false
    description: "Path to dagster_cloud.yaml relative to project_dir"
    default: "dagster_cloud.yaml"
  deployment:
    required: false
    description: "The deployment name to deploy. For pull requests, this deployment will be used as the base deployment."
    default: "prod"
  location_names:
    required: false
    description: "JSON list containing names of locations to deploy. If unspecified, all locations are deployed."

runs:
  using: "composite"
  steps:
    - name: init-env-vars
      env:
        PEX_ARCH: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
      run: >
        echo "DAGSTER_CLOUD_PEX=$GITHUB_ACTION_PATH/../../../generated/gha/dagster-cloud-$PEX_ARCH.pex" >> "$GITHUB_ENV" &&
        echo "DAGSTER_BUILD_STATEDIR=/tmp/statedir-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      shell: bash

    - name: set-location-names
      if: ${{ inputs.location_names }}
      env:
        LOCATION_NAMES_FLAG: ${{ format('--location-name={0}', join(fromJSON(inputs.location_names), ' --location-name=')) }}
      run: echo "LOCATION_NAMES_FLAG=$LOCATION_NAMES_FLAG" >> "$GITHUB_ENV"
      shell: bash

    # Initialize the build session.  LOCATION_NAMES_FLAG stays unquoted so that
    # it splits into one --location-name argument per location, or into none
    # when it is unset.
    - id: ci-init
      env:
        PROJECT_DIR: ${{ inputs.project_dir }}
        DAGSTER_CLOUD_YAML_PATH: ${{ inputs.dagster_cloud_yaml_path }}
        DEPLOYMENT_NAME: ${{ inputs.deployment }}
        COMMIT_HASH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: >
        "$DAGSTER_CLOUD_PEX" -m dagster_cloud_cli.entrypoint ci init
        --project-dir="$PROJECT_DIR"
        --dagster-cloud-yaml-path="$DAGSTER_CLOUD_YAML_PATH"
        --deployment="$DEPLOYMENT_NAME"
        --status-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        --git-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$COMMIT_HASH"
        --commit-hash="$COMMIT_HASH"
        $LOCATION_NAMES_FLAG
      shell: bash

    # Print location status
    - id: ci-status
      run: $DAGSTER_CLOUD_PEX -m dagster_cloud_cli.entrypoint ci status
      shell: bash

    # Create a PR comment if necessary
    - id: ci-notify
      env:
        PROJECT_DIR: ${{ inputs.project_dir }}
      run: $DAGSTER_CLOUD_PEX -m dagster_cloud_cli.entrypoint ci notify --project-dir="$PROJECT_DIR"
      shell: bash
