name: "dg cli <command>"
description: "Run a dg cli command"
inputs:
  command:
    required: true
    description: "The dg cli command to run"

runs:
  using: "composite"
  steps:
    # The command input is a shell command line: workflows pass $VAR references
    # and redirections such as `>> $GITHUB_STEP_SUMMARY` in it, so it goes
    # through eval.  Reading it from the environment keeps the input out of the
    # script text that GitHub generates for this step.
    - id: dg-cli
      env:
        PEX_ARCH: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
        DG_CLI_COMMAND: ${{ inputs.command }}
      run: |
        pex="$GITHUB_ACTION_PATH/../../../generated/gha/dagster-cloud-$PEX_ARCH.pex"
        eval "\"\$pex\" -m dagster_dg_cli.cli.entrypoint $DG_CLI_COMMAND"
      shell: bash
