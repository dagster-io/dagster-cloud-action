name: 'Build and deploy dagster code locations'
description: 'Build project python executable, publish to dagster cloud, and update the code location'
inputs:
  dagster_cloud_file:
    description: 'Path to dagster_cloud.yaml'
    required: true
  python_version:
    description: 'Python version string, major.minor only, eg "3.8"'
    required: false
    default: '3.8'
  deployment:
    required: false
    description: "The deployment to push to, defaults to 'prod'. Ignored for pull requests where the branch deployment is used."
    default: "prod"
  deploy:
    description: 'Whether to upload the code files and update the code location'
    required: false
    default: 'true'
  build_output_dir:
    description: 'Directory for built artifacts'
    required: false
    default: '/tmp/build'
  force_rebuild_deps:
    description: 'Whether to rebuild the dependencies, even if requirements.txt and setup.py did not change'
    required: false
    default: 'false'

runs:
  using: "composite"

  steps:
    - name: Set ACTION_REPO
      run: >
        echo "ACTION_REPO=$GITHUB_ACTION_PATH/../../" >> $GITHUB_ENV
      shell: bash

    - name: Set deps-cache-from
      # Don't use cached deps if instructed
      if: ${{ inputs.force_rebuild_deps != 'true' }}
      run: echo "FLAG_DEPS_CACHE_FROM=--deps-cache-from=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      shell: bash

    - name: Set deps-cache-to
      run: echo "FLAG_DEPS_CACHE_TO=--deps-cache-to=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      shell: bash


    - id: setup-python
      name: Set up Python ${{ inputs.python_version }} for target
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    - env:
        PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      run: '"$PYTHON_PATH" -m pip install setuptools'
      shell: bash

    - env:
        DAGSTER_CLOUD_FILE: ${{ inputs.dagster_cloud_file }}
      run: >
        echo "SOURCE_DIRECTORY=$(dirname "$DAGSTER_CLOUD_FILE")" >> "$GITHUB_ENV"
      shell: bash

    # The FLAG_DEPS_CACHE_* variables stay unquoted so that an unset flag adds
    # no argument at all.
    - if: ${{ inputs.deploy == 'true' }}
      env:
        INPUT_DEPLOYMENT: ${{ inputs.deployment }}
        DAGSTER_CLOUD_FILE: ${{ inputs.dagster_cloud_file }}
        PYTHON_VERSION: ${{ inputs.python_version }}
      run: >
        cd "$ACTION_REPO" &&
        /usr/bin/python src/deploy_pex.py
        "$DAGSTER_CLOUD_FILE"
        --python-version="$PYTHON_VERSION"
        $FLAG_DEPS_CACHE_TO
        $FLAG_DEPS_CACHE_FROM
      shell: bash

    - if: ${{ inputs.deploy != 'true' }}
      env:
        PEX_ARCH: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
        BUILD_OUTPUT_DIR: ${{ inputs.build_output_dir }}
        PYTHON_VERSION: ${{ inputs.python_version }}
      run: >
        cd "$ACTION_REPO" &&
        "generated/gha/dagster-cloud-$PEX_ARCH.pex" -m dagster_cloud_cli.entrypoint
        serverless build-python-executable
        "$SOURCE_DIRECTORY" "$BUILD_OUTPUT_DIR"
        --python-version="$PYTHON_VERSION"
      shell: bash
